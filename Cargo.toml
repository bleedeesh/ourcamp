[workspace]
resolver = "2"
members = [
    "crates/oc-audio",
    "crates/oc-invite",
    "crates/oc-tls",
    "crates/oc-proto",
    "crates/oc-camp-client",
    "crates/oc-server",
    "apps/desktop/src-tauri",
    "apps/server/src-tauri",
]
# Not ours, only patched: see the `[patch.crates-io]` below.
exclude = ["vendor/livekit-0.9.7"]
# `cargo test` / `cargo clippy` at the root build only the platform-independent crates.
# The Tauri app needs the native webview toolchain, so it is built explicitly
# (`pnpm --filter @ourcamp/desktop tauri dev`).
default-members = [
    "crates/oc-audio",
    "crates/oc-invite",
    "crates/oc-tls",
    "crates/oc-proto",
    "crates/oc-camp-client",
    "crates/oc-server",
]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Audio code converts between sample counts and floats constantly; the casts are intentional.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# The SDK cannot publish stereo audio yet (ADR-0055, vendor/README.md).
[patch.crates-io]
livekit = { path = "vendor/livekit-0.9.7" }
