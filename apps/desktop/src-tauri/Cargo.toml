[package]
name = "ourcamp-desktop"
version = "0.1.0"
description = "OurCamp desktop client"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "ourcamp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
# Pinned minor: 0.16+ changes the device/config API; upgrade deliberately.
cpal = "0.15.3"
oc-audio = { path = "../../../crates/oc-audio" }
# Voice (M2). The SDK downloads a prebuilt libwebrtc on first build; on Windows it
# needs the static CRT (.cargo/config.toml, ADR-0012). Pinned: upgrade deliberately.
livekit = "=0.9.7"
oc-camp-client = { path = "../../../crates/oc-camp-client" }
oc-invite = { path = "../../../crates/oc-invite" }
oc-proto = { path = "../../../crates/oc-proto" }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time"] }
futures-util = { version = "0.3", default-features = false }

# H.264 through Media Foundation (ADR-0049). Same version as the rest of the tree.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Variant",
] }

[dev-dependencies]
# End-to-end voice through a real camp server (ignored tests, need `pnpm livekit`).
oc-server = { path = "../../../crates/oc-server" }

[lints]
workspace = true
