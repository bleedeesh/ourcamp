name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    name: Rust core and camp server (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p oc-audio -p oc-invite -p oc-tls -p oc-proto -p oc-camp-client -p oc-server --all-targets -- -D warnings
      - run: cargo test -p oc-audio -p oc-invite -p oc-tls -p oc-proto -p oc-camp-client -p oc-server

  managed-livekit:
    name: Camp's own LiveKit (${{ matrix.os }})
    # The camp runs livekit-server as a child (ADR-0022). The tie to the parent differs
    # per OS — a job object on Windows, a `sh` guardian on unix — so both are linted and
    # tested against the real binary. macOS has no release binary to test with.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node dev/fetch-livekit.ts
      - run: cargo clippy -p oc-server --all-targets -- -D warnings
      - run: cargo test -p oc-server -- --include-ignored

  miri:
    name: Miri (unsafe code in oc-audio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Quoted: an unquoted `: ` would start a YAML mapping.
      - run: "cargo miri test -p oc-audio -- ring:: mixer::"

  server-linux:
    name: Linux server archive (${{ matrix.arch }})
    # The archive owners put on a hosting (ADR-0043): a static oc-server, its LiveKit,
    # systemd. Built natively per architecture (livekit-server is fetched for it), then
    # installed on the runner for real and checked end to end.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node dev/fetch-livekit.ts
      - run: node dev/pack-server.ts
      - run: sh dev/test-server-install.sh target/pack/ourcamp-server-*-linux-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ourcamp-server-linux-${{ matrix.arch }}
          path: target/pack/ourcamp-server-*.tar.gz*
          if-no-files-found: error

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ourcamp/desktop typecheck
      - run: pnpm --filter @ourcamp/desktop test
      - run: pnpm --filter @ourcamp/desktop exec vite build
      - run: pnpm --filter @ourcamp/server typecheck
      - run: pnpm --filter @ourcamp/server test
      - run: pnpm --filter @ourcamp/server exec vite build
      - run: pnpm --filter @ourcamp/ui test

  desktop:
    name: Desktop apps — client and server window (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The first build downloads the prebuilt libwebrtc; later runs hit the cache.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tauri embeds the built frontend at compile time.
      - run: pnpm --filter @ourcamp/desktop exec vite build
      - run: pnpm --filter @ourcamp/server exec vite build
      - run: pnpm --filter @ourcamp/ui test
      - run: cargo clippy -p ourcamp-desktop -p ourcamp-server-app --all-targets -- -D warnings
      - run: cargo test -p ourcamp-desktop -p ourcamp-server-app

  voice:
    name: Voice against a real LiveKit (ignored tests)
    # Docker is only available on Linux runners; the server is the same compose file
    # developers use (`pnpm livekit`, ADR-0013).
    # Pinned (not -latest): the LLVM apt repository below is per Ubuntu codename.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The prebuilt libwebrtc for Linux ships Chromium's own libc++, whose headers need
      # clang >= 21; Ubuntu 24.04 has 18. webrtc-sys picks the compiler from CXX.
      - name: clang 21 (apt.llvm.org)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
      - name: System libraries (Tauri/WebKitGTK, ALSA for cpal, GLib headers for libwebrtc)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev \
            libasound2-dev libglib2.0-dev pkg-config build-essential clang-21
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ourcamp/desktop exec vite build
      - name: Start LiveKit
        run: |
          docker compose -f dev/compose.yaml up -d
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7880 >/dev/null && exit 0
            sleep 1
          done
          docker compose -f dev/compose.yaml logs
          exit 1
      - run: cargo test -p ourcamp-desktop -- --include-ignored
        env:
          CC: clang-21
          CXX: clang++-21
      - name: LiveKit logs
        if: failure()
        run: docker compose -f dev/compose.yaml logs
