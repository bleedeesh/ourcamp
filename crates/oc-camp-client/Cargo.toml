[package]
name = "oc-camp-client"
version = "0.1.0"
description = "Client side of the OurCamp camp API: device key, pinned HTTPS, login, room tokens."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
oc-invite = { path = "../oc-invite" }
oc-proto = { path = "../oc-proto" }
oc-tls = { path = "../oc-tls" }
ring = "0.17"
getrandom = "0.3"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# LiveKit SDK transport (ADR-0019). Exactly the version `livekit` uses: a second copy
# would be a second, empty registry and the pin would silently not apply.
livekit-net = { version = "=0.1.4", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
