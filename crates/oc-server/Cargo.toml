[package]
name = "oc-server"
version = "0.1.0"
description = "OurCamp Server: the camp a user hosts — API, invites, TLS, voice rooms (ADR-0016)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "oc-server"
path = "src/main.rs"

[dependencies]
oc-invite = { path = "../oc-invite" }
oc-tls = { path = "../oc-tls" }
oc-proto = { path = "../oc-proto" }
livekit-token = "0.3.1"
ring = "0.17"
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "ws"] }
bytes = "1"
http-body-util = "0.1"
serde_json = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# SQLite compiled in: nothing to install for whoever hosts a camp.
rusqlite = { version = "0.41", features = ["bundled"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }

# Job object: managed LiveKit dies with the camp (ADR-0022). Same version tokio uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
oc-camp-client = { path = "../oc-camp-client" }
livekit-net = { version = "=0.1.4", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1", features = ["io-util"] }

[lints]
workspace = true
