[package]
name = "oc-server"
version = "0.1.0"
description = "OurCamp Server: the camp a user hosts — API, invites, TLS, voice rooms (ADR-0016)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "oc-server"
path = "src/main.rs"

[dependencies]
oc-invite = { path = "../oc-invite" }
oc-tls = { path = "../oc-tls" }
oc-proto = { path = "../oc-proto" }
livekit-token = "0.3.1"
ring = "0.17"
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# SQLite compiled in: nothing to install for whoever hosts a camp.
rusqlite = { version = "0.41", features = ["bundled"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
oc-camp-client = { path = "../oc-camp-client" }
serde_json = "1"
tokio = { version = "1", features = ["io-util"] }

[lints]
workspace = true
